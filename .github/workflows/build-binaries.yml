name: Build Binaries

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            arch: arm64
            platform: darwin
          - os: macos-14
            arch: amd64
            platform: darwin
          - os: ubuntu-22.04
            arch: amd64
            platform: linux
          - os: ubuntu-22.04
            arch: arm64
            platform: linux

    runs-on: ${{ matrix.os }}

    env:
      BINARY_NAME: mytruv-${{ matrix.platform }}-${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v4

      - run: uv sync --frozen --all-extras

      - name: Build binary
        run: |
          uv run python -m nuitka \
            --standalone \
            --onefile \
            --output-filename="$BINARY_NAME" \
            --output-dir=dist \
            --include-package=mytruv_cli \
            --python-flag=no_site \
            --assume-yes-for-downloads \
            src/mytruv_cli/main.py

      - name: Smoke test
        run: ./dist/"$BINARY_NAME" --help

      - name: Create archive
        run: |
          cd dist
          tar -czf "${BINARY_NAME}.tar.gz" "$BINARY_NAME"

      - name: Generate checksum
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${BINARY_NAME}.tar.gz" > "${BINARY_NAME}.tar.gz.sha256"
          else
            shasum -a 256 "${BINARY_NAME}.tar.gz" > "${BINARY_NAME}.tar.gz.sha256"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
