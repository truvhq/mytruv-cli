[project]
name = "mytruv"
version = "0.1.0"
description = "CLI for accessing your MyTruv financial data"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1",
    "httpx>=0.25",
    "tomli-w>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
mytruv = "mytruv_cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mytruv_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
